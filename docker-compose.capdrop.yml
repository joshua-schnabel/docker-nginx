version: '3.8'

services:
  nginx:
    build: .
    container_name: nginx-capdrop
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/logs:/application/data/logs:rw
      - ./data/certs:/application/data/certs:rw
      - ./data/sites-enabled:/application/data/sites-enabled:rw
      - ./data/webroot:/application/data/webroot:rw
      - ./data/streams:/application/data/streams:rw
    environment:
      - TLS_MODE=acme
      - FORCE_TLS=true
      - ACME_MAIL=your-email@example.com
      - ACME_SERVER=letsencrypt
      - ACME_ECC=true
      - ACME_KEYLENGTH=ec-384
      - OUTPUT_FORMAT=json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=100M,noexec,nosuid,nodev
      - /var/run:size=10M,noexec,nosuid,nodev
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge