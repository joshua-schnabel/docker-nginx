name: docker

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: jschnabel/nginx

on:
  push:
    branches:
      - dev
      - master
  schedule:
    - cron: "0 4 * * SUN"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.genVersions.outputs.VERSION }}
      VERSION_MINOR: ${{ steps.genVersions.outputs.VERSION_MINOR }}
      BRANCH: ${{ steps.genVersions.outputs.BRANCH }}
      BUILD_DATE: ${{ steps.genVersions.outputs.BUILD_DATE }}
      GITHASH: ${{ steps.genVersions.outputs.GITHASH }}
      RELEASETYPE: ${{ steps.genVersions.outputs.RELEASETYPE }}
      TAGS: ${{ steps.genTags.outputs.TAGS }}
      VENDORVERSION: ${{ steps.genNginxVersions.outputs.VENDORVERSION }}
      ALPINEVERSION: ${{ steps.genNginxVersions.outputs.ALPINEVERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: genVersions
        name: Generate Versions
        uses: ./.github/actions/genVersions
      - name: "Guard: master must be stable"
        if: github.ref == 'refs/heads/master' && steps.genVersions.outputs.RELEASETYPE != ''
        run: |
          echo "Master branch must be stable (empty RELEASETYPE), but got '${{ steps.genVersions.outputs.RELEASETYPE }}'" >&2
          exit 1
      - id: genNginxVersions
        name: "Get Alpine & Nginx Versions"
        uses: ./.github/actions/getAlpineAndNginxVersion
      - id: genTags
        name: Generate Tags
        uses: ./.github/actions/genTags
        with:
          VERSION: ${{ steps.genVersions.outputs.VERSION }}
          VERSION_MINOR: ${{ steps.genVersions.outputs.VERSION_MINOR }}
          branch: ${{ steps.genVersions.outputs.BRANCH }}
          RELEASETYPE: ${{ steps.genVersions.outputs.RELEASETYPE }}
  docker:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ needs.prepare.outputs.TAGS }}
          cache-from: type=gha,scope=docker-nginx
          cache-to: type=gha,mode=max,scope=docker-nginx
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.BUILD_DATE }}
            VCS_REF=${{ needs.prepare.outputs.GITHASH }}
            VERSION=${{ needs.prepare.outputs.VERSION }}
            ALPINEVERSION=${{ needs.prepare.outputs.ALPINEVERSION }}            
            VENDORVERSION=${{ needs.prepare.outputs.VENDORVERSION }}            
  github:
    needs: [docker, prepare]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.RELEASETYPE == '' && github.event_name != 'schedule'
    permissions:
      contents: write
    steps:
      - name: Tag Version
        uses: hole19/git-tag-action@master
        env:
          TAG: "version-${{ needs.prepare.outputs.VERSION }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
