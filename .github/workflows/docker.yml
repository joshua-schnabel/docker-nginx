name: docker

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: jschnabel/nginx
  PLATFORMS: linux/arm/v7,linux/amd64,linux/arm64

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  schedule:
    - cron: "0 4 * * SUN"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      VERSION: ${{ steps.genVersions.outputs.VERSION }}
      VERSION_MINOR: ${{ steps.genVersions.outputs.VERSION_MINOR }}
      BRANCH: ${{ steps.genVersions.outputs.BRANCH }}
      BUILD_DATE: ${{ steps.genVersions.outputs.BUILD_DATE }}
      GITHASH: ${{ steps.genVersions.outputs.GITHASH }}
      RELEASETYPE: ${{ steps.genVersions.outputs.RELEASETYPE }}
      TAGS: ${{ steps.genTags.outputs.TAGS }}
      VENDORVERSION: ${{ steps.genNginxVersions.outputs.VENDORVERSION }}
      ALPINEVERSION: ${{ steps.genNginxVersions.outputs.ALPINEVERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: genVersions
        name: Generate Versions
        uses: ./.github/actions/genVersions
      - name: "Guard: main must be stable"
        if: github.ref == 'refs/heads/main' && steps.genVersions.outputs.RELEASETYPE != ''
        run: |
          echo "Main branch must be stable (empty RELEASETYPE), but got '${{ steps.genVersions.outputs.RELEASETYPE }}'" >&2
          exit 1
      - id: genNginxVersions
        name: "Get Alpine & Nginx Versions"
        uses: ./.github/actions/getAlpineAndNginxVersion
      - id: genTags
        name: Generate Tags
        uses: ./.github/actions/genTags
        with:
          VERSION: ${{ steps.genVersions.outputs.VERSION }}
          VERSION_MINOR: ${{ steps.genVersions.outputs.VERSION_MINOR }}
          branch: ${{ steps.genVersions.outputs.BRANCH }}
          RELEASETYPE: ${{ steps.genVersions.outputs.RELEASETYPE }}

  test:
    name: Test amd64 (no ACME)
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-test-amd64-${{ github.sha }}
          cache-from: type=gha,scope=docker-nginx-test
          cache-to: type=gha,mode=max,scope=docker-nginx-test
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.BUILD_DATE }}
            VCS_REF=${{ needs.prepare.outputs.GITHASH }}
            VERSION=${{ needs.prepare.outputs.VERSION }}
            ALPINEVERSION=${{ needs.prepare.outputs.ALPINEVERSION }}
            VENDORVERSION=${{ needs.prepare.outputs.VENDORVERSION }}
      - name: Run container (TLS_MODE=off)
        env:
          TLS_MODE: off
        run: |
          docker run -d --rm \
            -e TLS_MODE=${TLS_MODE} \
            --platform linux/amd64 \
            -p 18080:8080 \
            -p 14444:4444 \
            --name nginx-ci \
            ${{ env.IMAGE_NAME }}:ci-test-amd64-${{ github.sha }}
      - name: Wait for health endpoint
        run: |
          for i in {1..60}; do \
            if curl -fsS http://127.0.0.1:14444/health >/dev/null; then echo "healthy"; exit 0; fi; \
            sleep 1; \
          done; \
          echo "Service did not become healthy in time" >&2; \
          docker logs nginx-ci || true; \
          exit 1
      - name: Check welcome page (HTTP)
        run: |
          curl -fsS http://127.0.0.1:18080/ | grep -q "Welcome to your website"
      - name: Print logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs nginx-ci || true
      - name: Stop container
        if: always()
        run: |
          docker rm -f nginx-ci || true

  scan:
    name: Trivy scan (amd64)
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build scan image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-scan-amd64-${{ github.sha }}
          cache-from: type=gha,scope=docker-nginx-scan
          cache-to: type=gha,mode=max,scope=docker-nginx-scan
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.BUILD_DATE }}
            VCS_REF=${{ needs.prepare.outputs.GITHASH }}
            VERSION=${{ needs.prepare.outputs.VERSION }}
            ALPINEVERSION=${{ needs.prepare.outputs.ALPINEVERSION }}
            VENDORVERSION=${{ needs.prepare.outputs.VENDORVERSION }}
      - name: Trivy scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-scan-amd64-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '1'
          timeout: 10m
      - name: Upload Trivy report (SARIF)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # Note: The test builds its own image; final build happens in publish
  publish:
    name: Publish multi-arch image
    needs: [prepare, test, scan]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push multi-arch image (final tags only)
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ needs.prepare.outputs.TAGS }}
          cache-from: type=gha,scope=docker-nginx
          cache-to: type=gha,mode=max,scope=docker-nginx
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.BUILD_DATE }}
            VCS_REF=${{ needs.prepare.outputs.GITHASH }}
            VERSION=${{ needs.prepare.outputs.VERSION }}
            ALPINEVERSION=${{ needs.prepare.outputs.ALPINEVERSION }}
            VENDORVERSION=${{ needs.prepare.outputs.VENDORVERSION }}
      - name: Inspect pushed manifests (ensure platforms present)
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra TAGS <<< "${{ needs.prepare.outputs.TAGS }}"
          for TAG in "${TAGS[@]}"; do
            echo "Inspecting manifest for $TAG"
            for i in {1..10}; do
              OUT=$(docker buildx imagetools inspect "$TAG" || true)
              if echo "$OUT" | grep -q 'linux/amd64' \
                 && echo "$OUT" | grep -q 'linux/arm64' \
                 && echo "$OUT" | grep -q 'linux/arm/v7'; then
                echo "$OUT"
                break
              fi
              echo "Manifest not fully available yet (attempt $i). Retrying..."
              sleep 3
              if [ "$i" -eq 10 ]; then
                echo "$OUT"
                echo "Manifest check failed for $TAG" >&2
                exit 1
              fi
            done
          done
      - name: Docker logout
        if: always()
        run: docker logout || true
      - name: Buildx prune
        if: always()
        run: docker buildx prune -f || true
  github:
    needs: [publish, prepare]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.RELEASETYPE == '' && github.event_name != 'schedule'
    permissions:
      contents: write
    steps:
      - name: Tag Version
        uses: hole19/git-tag-action@master
        env:
          TAG: "version-${{ needs.prepare.outputs.VERSION }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
