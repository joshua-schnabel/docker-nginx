name: docker

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: jschnabel/nginx
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

on:
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: "0 4 * * SUN"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.genVersions.outputs.VERSION }}
      VERSION_MINOR: ${{ steps.genVersions.outputs.VERSION_MINOR }}
      BRANCH: ${{ steps.genVersions.outputs.BRANCH }}
      BUILD_DATE: ${{ steps.genVersions.outputs.BUILD_DATE }}
      GITHASH: ${{ steps.genVersions.outputs.GITHASH }}
      RELEASETYPE: ${{ steps.genVersions.outputs.RELEASETYPE }}
      TAGS: ${{ steps.genTags.outputs.TAGS }}
      VENDORVERSION: ${{ steps.genNginxVersions.outputs.VENDORVERSION }}
      ALPINEVERSION: ${{ steps.genNginxVersions.outputs.ALPINEVERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: genVersions
        name: Generate Versions
        uses: ./.github/actions/genVersions
      - name: "Guard: master must be stable"
        if: github.ref == 'refs/heads/master' && steps.genVersions.outputs.RELEASETYPE != ''
        run: |
          echo "Master branch must be stable (empty RELEASETYPE), but got '${{ steps.genVersions.outputs.RELEASETYPE }}'" >&2
          exit 1
      - id: genNginxVersions
        name: "Get Alpine & Nginx Versions"
        uses: ./.github/actions/getAlpineAndNginxVersion
      - id: genTags
        name: Generate Tags
        uses: ./.github/actions/genTags
        with:
          VERSION: ${{ steps.genVersions.outputs.VERSION }}
          VERSION_MINOR: ${{ steps.genVersions.outputs.VERSION_MINOR }}
          branch: ${{ steps.genVersions.outputs.BRANCH }}
          RELEASETYPE: ${{ steps.genVersions.outputs.RELEASETYPE }}
  test:
    name: Test amd64 (no ACME)
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download built amd64 image
        uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: .
      - name: Load image
        run: |
          docker load -i image-amd64.tar
      - name: Run container (TLS_MODE=off)
        env:
          TLS_MODE: off
        run: |
          docker run -d --rm \
            -e TLS_MODE=${TLS_MODE} \
            --platform linux/amd64 \
            -p 18080:8080 \
            -p 14444:4444 \
            --name nginx-ci \
            ${{ env.IMAGE_NAME }}:ci-amd64-${{ github.sha }}
      - name: Wait for health endpoint
        run: |
          for i in {1..60}; do \
            if curl -fsS http://127.0.0.1:14444/health >/dev/null; then echo "healthy"; exit 0; fi; \
            sleep 1; \
          done; \
          echo "Service did not become healthy in time" >&2; \
          docker logs nginx-ci || true; \
          exit 1
      - name: Check welcome page (HTTP)
        run: |
          curl -fsS http://127.0.0.1:18080/ | grep -q "Welcome to your website"
      - name: Print logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs nginx-ci || true
      - name: Stop container
        if: always()
        run: |
          docker rm -f nginx-ci || true
  docker:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=docker-nginx
          cache-to: type=gha,mode=max,scope=docker-nginx
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.BUILD_DATE }}
            VCS_REF=${{ needs.prepare.outputs.GITHASH }}
            VERSION=${{ needs.prepare.outputs.VERSION }}
            ALPINEVERSION=${{ needs.prepare.outputs.ALPINEVERSION }}
            VENDORVERSION=${{ needs.prepare.outputs.VENDORVERSION }}
      - name: Save amd64 image tar
        run: |
          docker save ${{ env.IMAGE_NAME }}:ci-${{ matrix.arch }}-${{ github.sha }} -o image-${{ matrix.arch }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          if-no-files-found: error
  publish:
    name: Publish multi-arch image
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: .
      - name: Load images
        run: |
          docker load -i image-${{ matrix.arch }}.tar
      - name: Tag images for push
        run: |
          docker tag ${{ env.IMAGE_NAME }}:ci-${{ matrix.arch }}-${{ github.sha }} ${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }}
      - name: Push per-arch images
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }}
      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra TAG_ARR <<< "${{ needs.prepare.outputs.TAGS }}"
          for TAG in "${TAG_ARR[@]}"; do
            echo "Creating manifest: $TAG"
            docker buildx imagetools create -t "$TAG" ${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }}
          done
  github:
    needs: [publish, prepare]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.RELEASETYPE == '' && github.event_name != 'schedule'
    permissions:
      contents: write
    steps:
      - name: Tag Version
        uses: hole19/git-tag-action@master
        env:
          TAG: "version-${{ needs.prepare.outputs.VERSION }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
