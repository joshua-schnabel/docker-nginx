name: "Generate Nginx Versions"
description: "Detect Alpine and Nginx versions from Alpine repositories"
outputs:
  ALPINEVERSION:
    description: ALPINEVERSION
    value: ${{ steps.detect.outputs.ALPINEVERSION }}
  VENDORVERSION:
    description: NGINX vendor version (with revision)
    value: ${{ steps.detect.outputs.VENDORVERSION }}
  VENDORVERSIONSHORT:
    description: NGINX version (without revision)
    value: ${{ steps.detect.outputs.VENDORVERSIONSHORT }}
runs:
  using: "composite"
  steps:
  - id: detect
    name: Detect versions
    shell: bash
    run: |
      set -euo pipefail
      ALPINEVERSION=$(curl -fsSL "https://hub.docker.com/v2/repositories/library/alpine/tags?page_size=50" \
        | jq -r '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+$"))] | max_by(.name | split(".") | map(tonumber)) .name')
      if [ -z "${ALPINEVERSION:-}" ]; then
        echo "ERROR: Unable to detect ALPINEVERSION" >&2
        exit 1
      fi
      echo "ALPINEVERSION=$ALPINEVERSION"
      # Download page to a temp file to avoid pipelines that can cause SIGPIPE
      TMP_HTML=$(mktemp)
      trap 'rm -f "$TMP_HTML"' EXIT
      curl -fsSL --retry 5 --retry-delay 1 "https://pkgs.alpinelinux.org/package/v$ALPINEVERSION/main/x86_64/nginx" -o "$TMP_HTML"
      NGINXVERSION=$(grep -o -h -m 1 "[[:digit:]]\.[[:digit:]]\{1,2\}\.[[:digit:]]\{1,2\}-r[0-9]\{1,2\}" "$TMP_HTML")
      if [ -z "${NGINXVERSION:-}" ]; then
        echo "ERROR: Unable to detect NGINXVERSION for Alpine $ALPINEVERSION" >&2
        exit 1
      fi
      NGINXVERSIONSHORT=${NGINXVERSION%-*}
      echo "NGINXVERSION=$NGINXVERSION"
      {
        echo "ALPINEVERSION=$ALPINEVERSION"
        echo "VENDORVERSION=$NGINXVERSION"
        echo "VENDORVERSIONSHORT=$NGINXVERSIONSHORT"
      } >> "$GITHUB_OUTPUT"
